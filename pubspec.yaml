name: ravn
description: "Ravn HRMS mobile client (Flutter + BLoC)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  http: ^1.6.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.3.4
  intl: ^0.20.3
  uuid: ^4.6.0
  heroicons_flutter: ^0.5.0
  go_router: ^16.2.4
  get_it: ^8.2.0
  injectable: ^2.5.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_package_name: ^1.1.1
  build_runner: ^2.7.0
  json_serializable: ^6.11.1
  freezed: ^3.2.3
  injectable_generator: ^2.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
